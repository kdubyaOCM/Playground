[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-toolbox"
version = "0.1.0"
description = "Cross-platform CLI for archiving and processing email data."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
outlook-toolbox = "outlook_toolbox.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
